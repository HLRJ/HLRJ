<svg width="1200" height="210" viewBox="0 0 1200 210" fill="none" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="title desc">
  <title id="title">HLRJ System Operator</title>
  <desc id="desc">Compact industrial system console banner for HLRJ.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1200" y2="210" gradientUnits="userSpaceOnUse">
      <stop stop-color="#0D1117"/>
      <stop offset="1" stop-color="#111827"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
      <stop stop-color="#58A6FF"/>
      <stop offset="1" stop-color="#7EE787"/>
    </linearGradient>
  </defs>

  <rect x="1" y="1" width="1198" height="208" rx="16" fill="url(#bg)" stroke="#30363D" stroke-width="2"/>
  <circle cx="34" cy="27" r="4" fill="#FF7B72"/>
  <circle cx="50" cy="27" r="4" fill="#E3B341"/>
  <circle cx="66" cy="27" r="4" fill="#3FB950"/>
  <text x="92" y="32" fill="#7D8590" font-family="JetBrains Mono, Consolas, monospace" font-size="12">HLRJ://PROFILE</text>
  <line x1="28" y1="48" x2="1172" y2="48" stroke="#21262D"/>

  <text x="42" y="94" fill="#F0F6FC" font-family="JetBrains Mono, Consolas, monospace" font-size="35" font-weight="700">HLRJ</text>
  <text x="42" y="121" fill="#58A6FF" font-family="JetBrains Mono, Consolas, monospace" font-size="15">SYSTEM OPERATOR // BUILDER</text>
  <text x="42" y="151" fill="#8B949E" font-family="JetBrains Mono, Consolas, monospace" font-size="13">Compiler · Parallel · AI/Robotics · Game Dev</text>

  <rect x="636" y="70" width="520" height="94" rx="10" fill="#0B1220" stroke="#30363D"/>
  <text x="658" y="96" fill="#7D8590" font-family="JetBrains Mono, Consolas, monospace" font-size="12">ACTIVE DOMAINS</text>
  <text x="658" y="122" fill="#F0F6FC" font-family="JetBrains Mono, Consolas, monospace" font-size="14">01 COMPILER   02 PARALLEL   03 ROBOTICS</text>
  <text x="658" y="146" fill="#F0F6FC" font-family="JetBrains Mono, Consolas, monospace" font-size="14">04 AI SYSTEMS  05 GAME DEVELOPMENT</text>

  <rect x="42" y="179" width="1114" height="5" rx="2.5" fill="#161B22"/>
  <rect x="42" y="179" width="420" height="5" rx="2.5" fill="url(#accent)"/>
  <text x="1010" y="198" fill="#7EE787" font-family="JetBrains Mono, Consolas, monospace" font-size="11">● ONLINE</text>
</svg>
